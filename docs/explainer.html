<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MetaCog — how it works</title>
<style>
:root{--bg:#0f0f10;--card:#141415;--hdr:#1a1a1b;--line:#2a2a2c;--txt:#f4f4f5;--mute:#8a8a90;--dot:#2c2c2f;--wire:#cfcfd4;--ok:#3ecf6e;--bad:#f0544f;--warn:#f5b342;--pur:#a78bfa}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.3 Inter,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;align-items:center;justify-content:center}
.card{width:min(100vw,100vh);aspect-ratio:1/1;position:relative;overflow:hidden;
 background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.1px,transparent 1.2px);background-size:14px 14px}
svg{width:100%;height:100%;display:block}
text{fill:var(--txt);font-family:inherit}
.m{fill:var(--mute)}
.node{opacity:0;transform:translateY(8px);transition:opacity .45s,transform .45s}
.node.show{opacity:1;transform:none}
.node.lose{opacity:.3}
.box{fill:var(--card);stroke:var(--line);stroke-width:1.2;transition:stroke .4s,filter .4s}
.hdr{fill:var(--hdr)}
.ico{fill:#242427;stroke:#333336;stroke-width:1}
.node.win .box{stroke:var(--ok);filter:drop-shadow(0 0 10px rgba(62,207,110,.45))}
.node.warn .box{stroke:var(--warn);filter:drop-shadow(0 0 10px rgba(245,179,66,.4))}
.edge{fill:none;stroke:var(--wire);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:2 5;opacity:0;transition:opacity .6s,stroke .4s}
.edge.show{opacity:.85}
.edge.win{stroke:var(--ok);stroke-width:2.2;stroke-dasharray:none;filter:drop-shadow(0 0 5px rgba(62,207,110,.7))}
.edge.lose{opacity:.15}
.port{fill:#fff;stroke:#000;stroke-width:1.5;opacity:0;transition:opacity .4s}
.port.show{opacity:1}
.ans{font-size:30px;font-weight:800}
.ans.right{fill:var(--ok)}.ans.wrong{fill:var(--bad)}
.meter{fill:#26262a}.fill{transition:width 1s ease-out}
.chip{opacity:0;transition:opacity .4s}.chip.show{opacity:1}
.title{position:absolute;top:3%;left:4%;font-size:clamp(14px,2.4vmin,24px);font-weight:700}
.title span{color:var(--mute);font-weight:500;margin-left:.6em;font-size:.8em}
.ctrl{position:absolute;top:3%;right:3%}
button{background:#1c1c1e;color:#ddd;border:1px solid #333;border-radius:7px;padding:5px 10px;font-size:12px;cursor:pointer}
.cap{position:absolute;left:0;right:0;bottom:2.6%;text-align:center;font-size:clamp(13px,2.1vmin,22px);color:var(--txt);padding:0 6%;min-height:2.6em}
.cap b{color:#fff}
.dot{fill:var(--ok)}
</style></head><body>
<div class="card">
<div class="title">MetaCog <span>how one question flows</span></div>
<div class="ctrl"><button id="replay">↻ Replay</button></div>
<svg viewBox="0 0 1000 1000">
 <!-- edges (right-angle dotted) -->
 <path class="edge" id="e0" d="M500 172 V200"/>
 <path class="edge" id="e1" d="M500 298 V335"/>
 <path class="edge" id="eStop" d="M552 372 H700 V440"/>
 <path class="edge" id="e2" d="M500 409 V470"/>
 <path class="edge" id="e3a" d="M500 470 V495 H200 V540"/>
 <path class="edge" id="e3b" d="M500 470 V495 H400 V540"/>
 <path class="edge" id="e3c" d="M500 470 V495 H600 V540"/>
 <path class="edge" id="e3d" d="M500 470 V495 H800 V540"/>
 <path class="edge" id="e4a" d="M200 770 V800 H500 V830"/>
 <path class="edge" id="e4b" d="M400 770 V800 H500 V830"/>
 <path class="edge" id="e4c" d="M600 770 V800 H500 V830"/>
 <path class="edge" id="e4d" d="M800 770 V800 H500 V830"/>
 <g id="ports"></g>

 <!-- question -->
 <g class="node" id="n0">
  <rect class="box" x="300" y="100" width="400" height="72" rx="10"/>
  <rect class="hdr" x="301" y="101" width="398" height="46" rx="9"/>
  <rect class="ico" x="314" y="110" width="28" height="28" rx="7"/><text x="328" y="130" text-anchor="middle" font-size="16" font-weight="700">?</text>
  <text x="354" y="121" font-size="14" font-weight="600">Question</text><text x="354" y="138" font-size="11" class="m">GPQA Diamond · chemistry</text>
  <text x="680" y="126" text-anchor="end" font-size="14" class="m">···</text>
  <text x="314" y="163" font-size="11" class="m">Difficulty</text><text x="686" y="163" text-anchor="end" font-size="11" fill="var(--warn)">● hard</text>
 </g>

 <!-- first answer -->
 <g class="node" id="n1">
  <rect class="box" x="330" y="200" width="340" height="98" rx="10"/>
  <rect class="hdr" x="331" y="201" width="338" height="46" rx="9"/>
  <rect class="ico" x="344" y="210" width="28" height="28" rx="7"/><text x="358" y="230" text-anchor="middle" font-size="14" font-weight="700">K</text>
  <text x="384" y="221" font-size="14" font-weight="600">Model</text><text x="384" y="238" font-size="11" class="m">Kimi K2.5 · one answer, as usual</text>
  <text x="650" y="226" text-anchor="end" font-size="14" class="m">···</text>
  <text x="344" y="264" font-size="11" class="m">Status</text><text x="656" y="264" text-anchor="end" font-size="11" fill="var(--ok)">● Done</text>
  <text x="344" y="286" font-size="11" class="m">Answer</text><text x="656" y="288" text-anchor="end" font-size="16" font-weight="800" fill="var(--bad)" id="a0" opacity="0" style="transition:.4s">B</text>
 </g>

 <!-- Jev central node (octagon) -->
 <g class="node" id="n2">
  <polygon class="box" points="478,335 522,335 545,358 545,386 522,409 478,409 455,386 455,358" fill="#161618"/>
  <text x="500" y="366" text-anchor="middle" font-size="12" font-weight="700">Jev</text>
  <text x="500" y="392" text-anchor="middle" font-size="12" font-weight="700" id="conf" fill="var(--warn)"></text>
 </g>
 <text x="560" y="360" font-size="11" class="m" id="stopLbl" opacity="0" style="transition:.4s">confident → stop</text>
 <text x="512" y="447" font-size="11" fill="var(--warn)" id="noLbl" opacity="0" style="transition:.4s">75% · not sure → branch</text>
 <g class="node" id="nStop">
  <rect class="box" x="640" y="440" width="120" height="34" rx="8"/><text x="700" y="462" text-anchor="middle" font-size="11" class="m">Return answer</text>
 </g>

 <g id="paths"></g>

 <!-- final -->
 <g class="node" id="n5">
  <rect class="box" x="330" y="830" width="340" height="72" rx="10"/>
  <rect class="hdr" x="331" y="831" width="338" height="46" rx="9"/>
  <rect class="ico" x="344" y="840" width="28" height="28" rx="7"/><text x="358" y="860" text-anchor="middle" font-size="14" font-weight="700">✓</text>
  <text x="384" y="851" font-size="14" font-weight="600" id="finT">Pick</text><text x="384" y="868" font-size="11" class="m" id="finS">highest total wins</text>
  <text x="650" y="856" text-anchor="end" font-size="14" class="m">···</text>
  <text x="344" y="893" font-size="11" class="m">Result</text><text x="656" y="893" text-anchor="end" font-size="11" id="finR"></text>
 </g>
</svg>
<div class="cap" id="cap"></div>
</div>

<script>
// Real run: GPQA Diamond (Pinacol rearrangement). Thinker Kimi K2.5, judge Jev. Model alone: B (wrong). Correct: D.
const P=[{x:200,ans:"B",ok:false,text:.75,prior:.45,lbl:"First answer",sub:"temperature 0"},
         {x:400,ans:"D",ok:true,text:.75,prior:.62,lbl:"Path 2",sub:"sampled"},
         {x:600,ans:"D",ok:true,text:.69,prior:.62,lbl:"Path 3",sub:"sampled"},
         {x:800,ans:"B",ok:false,text:.65,prior:.45,lbl:"Path 4",sub:"sampled"}];
const W=.5;
const PORTS=[[500,172],[500,200],[500,298],[500,335],[500,409],[500,470],[200,540],[400,540],[600,540],[800,540],[200,770],[400,770],[600,770],[800,770],[500,830]];
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let run=0;
function build(){
 $('#ports').innerHTML=PORTS.map(([x,y],i)=>`<circle class="port" id="pt${i}" cx="${x}" cy="${y}" r="4"/>`).join('');
 $('#paths').innerHTML=P.map((p,i)=>`<g class="node" id="p${i}">
  <rect class="box" x="${p.x-85}" y="540" width="170" height="230" rx="10"/>
  <rect class="hdr" x="${p.x-84}" y="541" width="168" height="46" rx="9"/>
  <rect class="ico" x="${p.x-72}" y="550" width="28" height="28" rx="7"/><text x="${p.x-58}" y="570" text-anchor="middle" font-size="12" font-weight="700">${i+1}</text>
  <text x="${p.x-36}" y="561" font-size="13" font-weight="600">${p.lbl}</text><text x="${p.x-36}" y="578" font-size="10.5" class="m">${p.sub}</text>
  <text x="${p.x-72}" y="608" font-size="11" class="m">Answer</text>
  <text x="${p.x+72}" y="614" text-anchor="end" class="ans ${p.ok?'right':'wrong'}" id="pa${i}" opacity="0" style="transition:.4s">${p.ans}</text>
  <g class="chip" id="c1_${i}"><text x="${p.x-72}" y="650" font-size="11" class="m">Jev · reasoning</text><text x="${p.x+72}" y="650" text-anchor="end" font-size="11" font-weight="700">${p.text.toFixed(2)}</text>
   <rect class="meter" x="${p.x-72}" y="657" width="144" height="5" rx="2.5"/><rect class="fill" x="${p.x-72}" y="657" width="0" height="5" rx="2.5" fill="var(--warn)" id="m1_${i}"/></g>
  <g class="chip" id="c2_${i}"><text x="${p.x-72}" y="690" font-size="11" class="m">Jev · bare answer</text><text x="${p.x+72}" y="690" text-anchor="end" font-size="11" font-weight="700">${p.prior.toFixed(2)}</text>
   <rect class="meter" x="${p.x-72}" y="697" width="144" height="5" rx="2.5"/><rect class="fill" x="${p.x-72}" y="697" width="0" height="5" rx="2.5" fill="var(--pur)" id="m2_${i}"/></g>
  <g class="chip" id="c3_${i}"><line x1="${p.x-72}" y1="722" x2="${p.x+72}" y2="722" stroke="var(--line)"/>
   <text x="${p.x-72}" y="750" font-size="11" class="m">Total</text><text x="${p.x+72}" y="752" text-anchor="end" font-size="15" font-weight="800">${(p.text+W*p.prior).toFixed(2)}</text></g>
 </g>`).join('');
}
const cap=t=>$('#cap').innerHTML=t;
const show=(...ids)=>ids.forEach(id=>$('#'+id).classList.add('show'));
async function play(){
 const my=++run, ok=()=>my===run;
 build();$$('.node,.edge,.port').forEach(e=>e.classList.remove('show','win','lose','warn'));$$('.chip').forEach(e=>e.classList.remove('show'));
 $('#a0').setAttribute('opacity',0);$('#conf').textContent='';['stopLbl','noLbl'].forEach(i=>$('#'+i).setAttribute('opacity',0));
 $('#finT').textContent='Pick';$('#finS').textContent='highest total wins';$('#finR').textContent='';
 await sleep(300);
 show('n0');cap('A question comes in.');await sleep(1400);if(!ok())return;
 show('e0','pt0','pt1');await sleep(400);show('n1');cap('The model answers once — exactly as it would on its own.');await sleep(1400);if(!ok())return;
 $('#a0').setAttribute('opacity',1);await sleep(1100);if(!ok())return;
 show('e1','pt2','pt3');await sleep(400);show('n2');cap('<b>Jev</b>, a separate small judge, reads the answer. If it\'s confident, we stop here — most easy questions do.');
 show('eStop','nStop');$('#stopLbl').setAttribute('opacity',1);await sleep(2300);if(!ok())return;
 $('#conf').textContent='75%';$('#n2').classList.add('warn');cap('Only 75% sure. Not enough.');await sleep(1500);if(!ok())return;
 $('#nStop').classList.add('lose');$('#eStop').classList.remove('show');$('#stopLbl').setAttribute('opacity',.3);
 $('#noLbl').setAttribute('opacity',1);show('e2','pt4','pt5');cap('Not sure → <b>branch</b>. The less sure Jev is, the more paths the model writes — all in parallel.');await sleep(900);if(!ok())return;
 for(const i of [0,1,2,3]){show('e3'+'abcd'[i],'pt'+(6+i));await sleep(140)}
 await sleep(400);P.forEach((p,i)=>setTimeout(()=>ok()&&show('p'+i),i*170));await sleep(1500);if(!ok())return;
 P.forEach((p,i)=>$('#pa'+i).setAttribute('opacity',1));cap('Four complete answers. They disagree: B, D, D, B.');await sleep(2000);if(!ok())return;
 cap('Jev reads each path <b>on its own</b> and scores the reasoning.');
 P.forEach((p,i)=>{show('c1_'+i);$('#m1_'+i).setAttribute('width',144*p.text)});await sleep(2500);if(!ok())return;
 cap('Then a second look: Jev sees <b>only the bare answer</b>, no reasoning, and scores that too.');
 P.forEach((p,i)=>{show('c2_'+i);$('#m2_'+i).setAttribute('width',144*p.prior)});await sleep(2500);if(!ok())return;
 cap('Add them up — the tie between B and D breaks.');P.forEach((p,i)=>show('c3_'+i));await sleep(1500);if(!ok())return;
 for(const i of [0,1,2,3]){show('e4'+'abcd'[i],'pt'+(10+i))}show('pt14');await sleep(500);show('n5');await sleep(900);if(!ok())return;
 const win=1;
 P.forEach((p,i)=>{const w=i===win;['p'+i,'e3'+'abcd'[i],'e4'+'abcd'[i]].forEach(id=>$('#'+id).classList.add(w?'win':'lose'))});
 ['e0','e1','e2','n5'].forEach(id=>$('#'+id).classList.add('win'));
 $('#finT').textContent='Answer: D';$('#finS').textContent='path 2 · highest total';$('#finR').innerHTML='<tspan fill="var(--ok)">● correct</tspan>  <tspan fill="var(--mute)">· alone it said</tspan> <tspan fill="var(--bad)">B ✗</tspan>';
 cap('Highest total wins: <b>D</b> — correct. Same model, no retraining, one small judge.');
}
$('#replay').onclick=play;play();
</script></body></html>
