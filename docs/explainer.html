<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MetaCog — how it works</title>
<style>
:root{--bg:#0b0f17;--node:#151c2c;--line:#334155;--txt:#f1f5f9;--mute:#94a3b8;--acc:#7c9cff;--ok:#34d399;--bad:#f87171;--warn:#fbbf24;--pur:#c084fc}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:16px/1.3 -apple-system,Inter,Segoe UI,Roboto,sans-serif;display:flex;align-items:center;justify-content:center}
.card{width:min(100vw,100vh);aspect-ratio:1/1;position:relative;background:radial-gradient(circle at 50% 0%,#141c30 0%,var(--bg) 60%)}
svg{width:100%;height:100%;display:block}
text{fill:var(--txt);font-family:inherit}
.t-mute{fill:var(--mute)}
.node rect,.node polygon{fill:var(--node);stroke:var(--line);stroke-width:2;transition:stroke .4s,filter .4s,fill .4s}
.node{opacity:0;transform:translateY(10px);transition:opacity .45s,transform .45s}
.node.show{opacity:1;transform:none}
.node.win rect{stroke:var(--ok);fill:#0f2a22;filter:drop-shadow(0 0 14px rgba(52,211,153,.6))}
.node.lose{opacity:.28}
.node.warn polygon{stroke:var(--warn);filter:drop-shadow(0 0 10px rgba(251,191,36,.5))}
.edge{fill:none;stroke:var(--line);stroke-width:3;stroke-linecap:round;stroke-dasharray:1000;stroke-dashoffset:1000;transition:stroke-dashoffset 1s ease-in-out,stroke .4s,opacity .4s}
.edge.show{stroke-dashoffset:0}
.edge.win{stroke:var(--ok);stroke-width:5;filter:drop-shadow(0 0 8px rgba(52,211,153,.7))}
.edge.lose{opacity:.2}
.edge.dash{stroke-dasharray:8 8;stroke-dashoffset:0;opacity:0}
.edge.dash.show{opacity:.35}
.ans{font-size:38px;font-weight:800}
.ans.right{fill:var(--ok)}.ans.wrong{fill:var(--bad)}
.meter{fill:#1e293b}
.fill{transition:width 1s ease-out}
.jev{fill:var(--acc)}
.chip{opacity:0;transition:opacity .4s}
.chip.show{opacity:1}
.cap{position:absolute;left:0;right:0;bottom:3.2%;text-align:center;font-size:clamp(14px,2.3vmin,26px);color:var(--txt);padding:0 6%;min-height:2.6em}
.cap b{color:var(--acc)}
.title{position:absolute;top:2.6%;left:0;right:0;text-align:center;font-size:clamp(18px,3.4vmin,38px);font-weight:800;letter-spacing:-.02em}
.title span{color:var(--acc)}
.ctrl{position:absolute;top:2.5%;right:2.5%;display:flex;gap:6px}
button{background:#1e293b;color:#fff;border:1px solid #334155;border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;opacity:.6}button:hover{opacity:1}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
</style></head><body>
<div class="card">
<div class="title">MetaCog: <span>think in branches, let a judge pick</span></div>
<div class="ctrl"><button id="replay">↻ Replay</button></div>
<svg viewBox="0 0 1000 1000" id="s">
 <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>

 <!-- edges -->
 <path class="edge" id="e0" d="M500 168 V210"/>
 <path class="edge" id="e1" d="M500 290 V340"/>
 <path class="edge dash" id="eStop" d="M590 380 H720 V430"/>
 <path class="edge" id="e2" d="M500 420 V470"/>
 <path class="edge" id="e3a" d="M500 470 C500 500 200 500 200 540"/>
 <path class="edge" id="e3b" d="M500 470 C500 500 400 500 400 540"/>
 <path class="edge" id="e3c" d="M500 470 C500 500 600 500 600 540"/>
 <path class="edge" id="e3d" d="M500 470 C500 500 800 500 800 540"/>
 <path class="edge" id="e4a" d="M200 760 C200 800 500 800 500 830"/>
 <path class="edge" id="e4b" d="M400 760 C400 800 500 800 500 830"/>
 <path class="edge" id="e4c" d="M600 760 C600 800 500 800 500 830"/>
 <path class="edge" id="e4d" d="M800 760 C800 800 500 800 500 830"/>

 <!-- 1 question -->
 <g class="node" id="n0"><rect x="250" y="108" width="500" height="60" rx="14"/>
  <text x="500" y="146" text-anchor="middle" font-size="24" font-weight="700">A hard question</text></g>

 <!-- 2 first answer -->
 <g class="node" id="n1"><rect x="330" y="210" width="340" height="80" rx="14"/>
  <text x="500" y="243" text-anchor="middle" font-size="20" font-weight="700">Model writes one answer</text>
  <text x="500" y="272" text-anchor="middle" font-size="17" class="t-mute">(exactly what it would say alone)</text>
  <text x="640" y="258" text-anchor="middle" class="ans wrong" id="a0" style="opacity:0;transition:.4s">B</text></g>

 <!-- 3 judge diamond -->
 <g class="node" id="n2"><polygon points="500,330 610,380 500,430 390,380"/>
  <text x="500" y="374" text-anchor="middle" font-size="16" font-weight="700"><tspan class="jev">Jev</tspan>: sure it's right?</text>
  <text x="500" y="400" text-anchor="middle" font-size="18" font-weight="800" id="conf"></text></g>
 <g class="node" id="nStop"><rect x="650" y="430" width="140" height="44" rx="10"/>
  <text x="720" y="458" text-anchor="middle" font-size="15" class="t-mute">yes → done ✓</text></g>
 <text x="530" y="455" font-size="15" fill="var(--warn)" id="noLbl" opacity="0" style="transition:.4s">no → branch</text>

 <!-- 4 paths -->
 <g id="paths"></g>

 <!-- 5 final -->
 <g class="node" id="n5"><rect x="330" y="830" width="340" height="70" rx="14"/>
  <text x="500" y="861" text-anchor="middle" font-size="18" font-weight="700" id="finT">Judge picks the best path</text>
  <text x="500" y="886" text-anchor="middle" font-size="15" class="t-mute" id="finS"></text></g>
</svg>
<div class="cap" id="cap"></div>
</div>

<script>
// Real run: GPQA Diamond (organic chemistry), thinker Kimi K2.5, judge Jev. Model alone: B (wrong). Correct: D.
const P=[{x:200,ans:"B",ok:false,text:.75,prior:.45,lbl:"first answer"},{x:400,ans:"D",ok:true,text:.75,prior:.62,lbl:"path 2"},{x:600,ans:"D",ok:true,text:.69,prior:.62,lbl:"path 3"},{x:800,ans:"B",ok:false,text:.65,prior:.45,lbl:"path 4"}];
const W=.5;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let run=0;
function build(){
 $('#paths').innerHTML=P.map((p,i)=>`<g class="node" id="p${i}">
  <rect x="${p.x-85}" y="540" width="170" height="220" rx="14"/>
  <text x="${p.x}" y="566" text-anchor="middle" font-size="14" class="t-mute">${p.lbl}</text>
  <text x="${p.x}" y="620" text-anchor="middle" class="ans ${p.ok?'right':'wrong'}" id="pa${i}" style="opacity:0;transition:.4s">${p.ans}</text>
  <g class="chip" id="c1_${i}"><text x="${p.x-70}" y="660" font-size="13" class="t-mute">reasoning</text>
   <rect class="meter" x="${p.x-70}" y="668" width="140" height="10" rx="5"/><rect class="fill" x="${p.x-70}" y="668" width="0" height="10" rx="5" fill="var(--warn)" id="m1_${i}"/>
   <text x="${p.x+70}" y="661" text-anchor="end" font-size="13" font-weight="700">${p.text.toFixed(2)}</text></g>
  <g class="chip" id="c2_${i}"><text x="${p.x-70}" y="702" font-size="13" class="t-mute">bare answer "${p.ans}"</text>
   <rect class="meter" x="${p.x-70}" y="710" width="140" height="10" rx="5"/><rect class="fill" x="${p.x-70}" y="710" width="0" height="10" rx="5" fill="var(--pur)" id="m2_${i}"/>
   <text x="${p.x+70}" y="703" text-anchor="end" font-size="13" font-weight="700">${p.prior.toFixed(2)}</text></g>
  <g class="chip" id="c3_${i}"><text x="${p.x}" y="748" text-anchor="middle" font-size="16" font-weight="800">total ${(p.text+W*p.prior).toFixed(2)}</text></g>
 </g>`).join('');
}
function cap(t){$('#cap').innerHTML=t}
async function play(){
 const my=++run, ok=()=>my===run;
 build();$$('.node,.edge').forEach(e=>e.classList.remove('show','win','lose','warn'));$$('.chip').forEach(e=>e.classList.remove('show'));
 $('#a0').style.opacity=0;$('#conf').textContent='';$('#noLbl').setAttribute('opacity',0);$('#finT').textContent='Judge picks the best path';$('#finS').textContent='';
 await sleep(300);
 $('#n0').classList.add('show');cap('1 · A question comes in.');await sleep(1500);if(!ok())return;
 $('#e0').classList.add('show');await sleep(500);$('#n1').classList.add('show');cap('2 · The model answers once — like normal.');await sleep(1400);if(!ok())return;
 $('#a0').style.opacity=1;await sleep(1200);if(!ok())return;
 $('#e1').classList.add('show');await sleep(500);$('#n2').classList.add('show');cap('3 · An independent judge, <b>Jev</b>, reads the answer. Confident → we\'re done (most easy questions stop here).');
 $('#eStop').classList.add('show');$('#nStop').classList.add('show');await sleep(2200);if(!ok())return;
 $('#conf').textContent='75% — not sure';$('#n2').classList.add('warn');cap('Only 75% sure. Not enough.');await sleep(1600);if(!ok())return;
 $('#noLbl').setAttribute('opacity',1);$('#e2').classList.add('show');$('#nStop').classList.add('lose');$('#eStop').classList.remove('show');
 cap('4 · Not sure → <b>branch</b>. The less sure Jev is, the more paths the model writes, all at once.');await sleep(800);if(!ok())return;
 for(const i of [0,1,2,3]){$('#e3'+'abcd'[i]).classList.add('show');await sleep(150)}
 await sleep(500);P.forEach((p,i)=>setTimeout(()=>ok()&&$('#p'+i).classList.add('show'),i*180));await sleep(1600);if(!ok())return;
 P.forEach((p,i)=>$('#pa'+i).style.opacity=1);cap('Four full answers. They disagree: B, D, D, B.');await sleep(2000);if(!ok())return;
 cap('5 · Jev reads each path <b>separately</b> and scores how right the reasoning looks.');
 P.forEach((p,i)=>{$('#c1_'+i).classList.add('show');$('#m1_'+i).setAttribute('width',140*p.text)});await sleep(2600);if(!ok())return;
 cap('6 · Second look: Jev sees <b>only the bare answer</b> — no reasoning — and scores that too.');
 P.forEach((p,i)=>{$('#c2_'+i).classList.add('show');$('#m2_'+i).setAttribute('width',140*p.prior)});await sleep(2600);if(!ok())return;
 cap('Add them up. The tie between B and D breaks.');P.forEach((p,i)=>$('#c3_'+i).classList.add('show'));await sleep(1600);if(!ok())return;
 for(const i of [0,1,2,3]){$('#e4'+'abcd'[i]).classList.add('show')}await sleep(600);$('#n5').classList.add('show');await sleep(900);if(!ok())return;
 const win=1;
 P.forEach((p,i)=>{const w=i===win;$('#p'+i).classList.add(w?'win':'lose');$('#e4'+'abcd'[i]).classList.add(w?'win':'lose');$('#e3'+'abcd'[i]).classList.add(w?'win':'lose')});
 ['e0','e1','e2'].forEach(id=>$('#'+id).classList.add('win'));$('#n5').classList.add('win');
 $('#finT').innerHTML='Answer: <tspan fill="var(--ok)">D ✓</tspan>';$('#finS').textContent='the model alone said B ✗';
 cap('7 · Highest total wins: <b>D</b> — correct. Same model, no retraining, one small judge.');
}
$('#replay').onclick=play;play();
</script></body></html>
