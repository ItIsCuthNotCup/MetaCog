[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metacog"
version = "0.3.0"
description = "Model-agnostic metacognition loop: parallel reasoning paths pruned by a System-One judge"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
eval = ["datasets>=2.19"]
hf = ["transformers>=4.44", "torch>=2.2"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
metacog = "metacog.cli:main"
metacog-eval = "metacog.eval.humaneval:main"

[tool.hatch.build.targets.wheel]
packages = ["src/metacog"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"examples/live_demo.py" = ["E501"]
"examples/render_demo.py" = ["E501"]
